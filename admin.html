<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLF Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f12;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Admin Container */
        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .admin-sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f12 100%);
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h2 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #e63946, #ff6a3d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .admin-badge {
            background: rgba(230,57,70,0.2);
            color: #e63946;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        .sidebar-nav a.active {
            background: linear-gradient(90deg, rgba(230,57,70,0.2), transparent);
            border-left-color: #e63946;
            color: #fff;
        }

        .sidebar-nav a i {
            width: 20px;
            font-size: 1.1rem;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .logout-btn {
            width: 100%;
            padding: 12px;
            background: rgba(230,57,70,0.2);
            border: 1px solid rgba(230,57,70,0.3);
            color: #e63946;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #e63946;
            color: white;
        }

        /* Main Content */
        .admin-main {
            flex: 1;
            margin-left: 280px;
            padding: 24px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .admin-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            padding: 8px 16px;
            border-radius: 40px;
        }

        .admin-user i {
            font-size: 1.5rem;
            color: #e63946;
        }

        /* Dashboard Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.08);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-header i {
            font-size: 2rem;
            opacity: 0.5;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }

        .stat-change {
            font-size: 0.75rem;
            margin-top: 10px;
        }

        .stat-change.positive {
            color: #4caf50;
        }

        .stat-change.negative {
            color: #f44336;
        }

        /* Charts Row */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .chart-card h3 {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* Tables */
        .data-table {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow-x: auto;
        }

        .data-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .data-table th {
            background: rgba(0,0,0,0.3);
            font-weight: 600;
            color: rgba(255,255,255,0.8);
        }

        .data-table tr:hover {
            background: rgba(255,255,255,0.03);
        }

        /* Status Badges */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(255,152,0,0.2);
            color: #ff9800;
        }

        .status-approved {
            background: rgba(33,150,243,0.2);
            color: #2196f3;
        }

        .status-completed {
            background: rgba(76,175,80,0.2);
            color: #4caf50;
        }

        .status-cancelled {
            background: rgba(244,67,54,0.2);
            color: #f44336;
        }

        /* Buttons */
        .btn-primary {
            background: #e63946;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #c1121f;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        .btn-danger {
            background: rgba(244,67,54,0.2);
            color: #f44336;
            border: 1px solid rgba(244,67,54,0.3);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e63946;
        }

        /* Tabs */
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .admin-tab-btn {
            background: transparent;
            border: none;
            padding: 10px 20px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .admin-tab-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .admin-tab-btn.active {
            background: #e63946;
            color: white;
        }

        .admin-tab {
            display: none;
        }

        .admin-tab.active {
            display: block;
        }

        /* Stock Control */
        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .stock-info {
            flex: 1;
        }

        .stock-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .stock-category {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
        }

        .stock-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stock-quantity {
            font-weight: 700;
            min-width: 60px;
            text-align: center;
        }

        .stock-low {
            color: #ff9800;
        }

        .stock-out {
            color: #f44336;
        }

        .stock-input {
            width: 80px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            text-align: center;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            background: #1a1a2e;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .admin-sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 100;
            }

            .admin-sidebar.active {
                transform: translateX(0);
            }

            .admin-main {
                margin-left: 0;
            }

            .charts-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <h2>JLF Admin</h2>
                <span class="admin-badge">v2.0</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" data-tab="dashboard" class="active">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="#" data-tab="stock">
                    <i class="fas fa-boxes"></i> Stock Control
                </a>
                <a href="#" data-tab="orders">
                    <i class="fas fa-shopping-cart"></i> Orders
                </a>
                <a href="#" data-tab="recharge">
                    <i class="fas fa-wallet"></i> Recharges
                </a>
                <a href="#" data-tab="withdrawals">
                    <i class="fas fa-money-bill-wave"></i> Withdrawals
                </a>
                <a href="#" data-tab="investments">
                    <i class="fas fa-chart-line"></i> Investments
                </a>
                <a href="#" data-tab="users">
                    <i class="fas fa-users"></i> Users
                </a>
                <a href="#" data-tab="promocodes">
                    <i class="fas fa-ticket-alt"></i> Promo Codes
                </a>
                <a href="#" data-tab="events">
                    <i class="fas fa-calendar-alt"></i> Events
                </a>
                <a href="#" data-tab="sales">
                    <i class="fas fa-tags"></i> Sale Controller
                </a>
                <a href="#" data-tab="announcements">
                    <i class="fas fa-bullhorn"></i> Announcements
                </a>
                <a href="#" data-tab="bugreports">
                    <i class="fas fa-bug"></i> Bug Reports
                </a>
                <a href="#" data-tab="reviews">
                    <i class="fas fa-star"></i> Reviews
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" id="adminLogoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <h1 id="pageTitle">Dashboard</h1>
                <div class="admin-user">
                    <span id="adminName">Admin</span>
                    <i class="fas fa-user-circle"></i>
                </div>
            </div>

            <div id="adminContent">
                <!-- Dynamic content loads here -->
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading dashboard...</div>
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <script src="js/config.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/ui/toast.js"></script>
    <script src="js/admin/admin.js"></script>
    <script src="js/admin/stats.js"></script>
    <script src="js/admin/charts.js"></script>
    <script src="js/admin/stock-control.js"></script>
    <script src="js/admin/events.js"></script>
    <script src="js/admin/sale-controller.js"></script>
</body>
</html>
