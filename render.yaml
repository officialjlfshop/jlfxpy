services:
  # STATIC SITE - MUST BE FIRST (serves HTML/CSS/JS)
  - type: web
    name: jlf-fireworks
    runtime: static
    staticPublishPath: ./
    headers:
      - path: /css/*
        name: Content-Type
        value: text/css
      - path: /js/*
        name: Content-Type
        value: application/javascript
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # API SERVER - SECOND (only for API calls)
  - type: web
    name: jlf-fireworks-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node api/server.js
    envVars:
      - key: GOOGLE_SHEETS_URL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false