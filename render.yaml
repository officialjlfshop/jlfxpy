services:
  - type: web
    name: jlf-fireworks
    runtime: static
    staticPublishPath: ./
    headers:
      - path: /css/*.css
        name: Content-Type
        value: text/css
      - path: /js/*.js
        name: Content-Type
        value: application/javascript
      - path: /*.json
        name: Content-Type
        value: application/json
      - path: /manifest.json
        name: Content-Type
        value: application/json
      - path: /icons/*
        name: Content-Type
        value: image/png
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: jlf-fireworks-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node api/server.js
    envVars:
      - key: GOOGLE_SHEETS_URL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false